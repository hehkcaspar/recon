  <rect class="bg" width="2040" height="1980"/>
  <text x="40" y="42" class="pageTitle">Recon / Galaxy Z Fold8 inner display</text>
  <text x="40" y="64" class="small">Representative 4:3 geometry · 4:3 landscape / 3:4 portrait · each direction shown with rear and front camera test scenes</text>

  <use href="#landscapeRear" x="20" y="90" width="960" height="720"/>
  <use href="#landscapeFront" x="1060" y="90" width="960" height="720"/>
  <text x="20" y="836" class="label">Fold8 / Landscape / Rear</text>
  <text x="1060" y="836" class="label">Fold8 / Landscape / Front</text>

  <use href="#portraitRear" x="140" y="880" width="720" height="960"/>
  <use href="#portraitFront" x="1180" y="880" width="720" height="960"/>
  <path d="M1020 90v720M1020 880v960" class="matrixSeparator"/>
  <text x="140" y="1868" class="label">Fold8 / Portrait / Rear</text>
  <text x="1180" y="1868" class="label">Fold8 / Portrait / Front</text>
  <text x="40" y="1910" class="small">Flat inner display prototype. Layout follows window bounds; preview direction follows camera metadata plus display rotation.</text>
  <text x="40" y="1928" class="small">Gold line separates comparison artboards; it is not a device hinge. Separating-hinge layouts must fit each region independently.</text>
  <text x="40" y="1946" class="small">Gestures: preview ↔ mode while idle · side rails own camera controls · queue edges commit/discard · gaps ↓/↑ split. Rotation continues recording; fold/unfold finalizes once.</text>
</svg>
