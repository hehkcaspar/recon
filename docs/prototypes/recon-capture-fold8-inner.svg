      <g transform="translate(720 122)"><use href="recon-capture-design-system.svg#zoomChips" width="220" height="40"/></g>
      <use href="recon-capture-design-system.svg#iconFlashAuto" x="806" y="218" width="48" height="48"/>
      <use href="recon-capture-design-system.svg#shutterPhoto" x="790" y="286" width="80" height="80"/>
