  <rect class="bg" width="2040" height="4210"/>
  <text x="40" y="42" class="pageTitle">Recon / Fold8 Ultra inner display — PHOTO</text>
  <text x="40" y="64" class="small">Representative near-square windows · 960 × 864 / 864 × 960 · 4:3 landscape / 3:4 portrait · logical units at 1:1</text>
  <use href="#ultraLandscapeRearPhoto" x="20" y="90" width="960" height="864"/>
  <text x="20" y="982" class="label">Fold8 Ultra / Landscape / Rear / PHOTO</text>
  <use href="#ultraLandscapeFrontPhoto" x="1060" y="90" width="960" height="864"/>
  <text x="1060" y="982" class="label">Fold8 Ultra / Landscape / Front / PHOTO</text>
  <use href="#ultraPortraitRearPhoto" x="140" y="1010" width="864" height="960"/>
  <text x="140" y="1998" class="label">Fold8 Ultra / Portrait / Rear / PHOTO</text>
  <use href="#ultraPortraitFrontPhoto" x="1036" y="1010" width="864" height="960"/>
  <text x="1036" y="1998" class="label">Fold8 Ultra / Portrait / Front / PHOTO</text>
  <path d="M1020 90v864M1020 1010v960" class="matrixSeparator"/>
  <text x="40" y="2138" class="pageTitle">Same windows — VIDEO / full-frame FIT_CENTER</text><text x="40" y="2160" class="small">16:9 landscape / 9:16 portrait · TL/TR/BL/BR frame markers all visible · black bars preserve the complete source image</text>
  <use href="#ultraLandscapeRearVideo" x="20" y="2200" width="960" height="864"/>
  <text x="20" y="3092" class="label">Fold8 Ultra / Landscape / Rear / VIDEO</text>
  <use href="#ultraLandscapeFrontVideo" x="1060" y="2200" width="960" height="864"/>
  <text x="1060" y="3092" class="label">Fold8 Ultra / Landscape / Front / VIDEO</text>
  <use href="#ultraPortraitRearVideo" x="140" y="3120" width="864" height="960"/>
  <text x="140" y="4108" class="label">Fold8 Ultra / Portrait / Rear / VIDEO</text>
  <use href="#ultraPortraitFrontVideo" x="1036" y="3120" width="864" height="960"/>
  <text x="1036" y="4108" class="label">Fold8 Ultra / Portrait / Front / VIDEO</text>
  <path d="M1020 2200v864M1020 3120v960" class="matrixSeparator"/>
  <text x="40" y="2040" class="small">The next matrix shows actual video frames in the same preview slots. Changing camera direction keeps control positions stable.</text>
  <text x="40" y="4140" class="small">Gold lines separate comparison artboards, not physical hinges. For a separating hinge, fit the preview and controls inside one usable region.</text>
  <text x="40" y="4162" class="small">Preview orientation follows sensor metadata and display rotation. Wide window geometry alone must never rotate a camera image.</text>
  <text x="40" y="4184" class="small">Rotation continues the same recording; fold/unfold stops and finalizes once. Controls shown here are idle. Gestures retain their initial input zones.</text>
</svg>
