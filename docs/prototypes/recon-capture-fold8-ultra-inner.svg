<svg xmlns="http://www.w3.org/2000/svg" width="2040" height="4210" viewBox="0 0 2040 4210">
  <title>Recon Android capture — Fold8 Ultra representative inner display</title>
  <desc>Representative near-square layout, not verified hardware dimensions. Photo and video each show rear/front in landscape/portrait at 1:1 logical units. Full-frame video test scenes expose all four corners without crop or distortion. Insets are illustrative.</desc>
